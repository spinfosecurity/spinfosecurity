name: Update ICS/OT advisories

on:
  schedule:
    # Weekly Monday 14:00 UTC — polite refresh cadence
    - cron: "0 14 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-advisories
  cancel-in-progress: true

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Aggregate CISA CSAF OT advisories
        run: python3 tools/aggregate.py --limit 120

      - name: Commit updated site artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/
          if git diff --staged --quiet; then
            echo "No advisory changes."
          else
            git commit -m "chore: refresh ICS/OT advisory aggregate"
            git push
          fi
